name: Generate Android Keystore Certificate

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Key
        run: |
          keytool -genkeypair -v -keystore kasirgue.keystore -alias kasirgue-key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kasir Gue, OU=Toko, O=KasirGue, L=Jakarta, S=DKI Jakarta, C=ID" -storepass kasirgue123 -keypass kasirgue123
          echo "=== SALIN STRING BASE64 DI BAWAH INI UNTUK GITHUB SECRETS ==="
          base64 -w 0 kasirgue.keystore
          echo ""
          echo "=== SELESAI ==="
